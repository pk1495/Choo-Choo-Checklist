<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cozy Train Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: full-height scene (sky, hills, looping track, train, stations) with a slim HUD on top and a checklist modal on demand. */
:root{
  --sky1:#f9b4cc; --sky2:#fcc9db; --sun:#fff3b8;
  --hill1:#c9e8b8; --hill2:#a9dba0; --hill3:#8fcf93;
  --track:#b78a6a; --rail:#8e6a52; --ballast:#e8d2bd;
  --ink:#5b3a4a; --ink-soft:#8c6577; --card:#fffafc; --card-2:#fff0f6; --line:#f6c9dc;
  --pink:#ff8fb8; --pink-deep:#ec5f95; --mint:#7fd8b0; --gold:#ffcf5c; --cloud:#ffffff;
  --shadow:0 10px 30px rgba(236,95,149,.25);
  --bg0:#fdd2e1; --bg1:#f7a9c6;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}

html,body{height:100%}
body{background:var(--bg1);color:var(--ink);color-scheme:light;font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden}
#root{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}
.display{font-family:var(--font-display)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px;border-radius:12px}

.stage{position:relative;flex:1;min-height:0;border-radius:28px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%,var(--bg0),var(--bg1) 75%);box-shadow:var(--shadow);border:3px solid var(--card)}
.stage svg.world{position:absolute;inset:0;width:100%;height:100%}
.cloud{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 1.8s ease-out infinite;opacity:0}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(-14px,-46px) scale(1.5)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chug{animation:chug .32s ease-in-out infinite alternate}
@keyframes chug{from{transform:translateY(0)}to{transform:translateY(-1.6px)}}
.paused .wheel,.paused .chug{animation-play-state:paused}
.station{cursor:pointer;transition:transform .2s}
.station:hover .bldg,.station:focus-visible .bldg{transform:translateY(-4px)}
.bldg{transition:transform .2s;transform-box:fill-box}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twinkle{0%,100%{transform:scale(.85) rotate(-6deg)}50%{transform:scale(1.15) rotate(6deg)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;color:var(--ink);
  font-weight:800;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;transition:transform .15s,background .15s}
.pill:hover{transform:translateY(-2px);background:var(--card-2)}
.pill:active{transform:scale(.96)}
.btn-primary{background:var(--pink-deep);color:#fff;border-radius:16px;font-weight:800;padding:10px 16px;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s}
.btn-primary:active{transform:translateY(3px);box-shadow:none}

.overlay{position:absolute;inset:0;z-index:30;background:rgba(91,58,74,.35);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:3px solid var(--line);border-radius:28px;box-shadow:var(--shadow);
  width:min(480px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.task{display:flex;align-items:center;gap:10px;background:var(--card-2);border:2px solid var(--line);border-radius:16px;padding:10px 12px;animation:pop .25s}
.check{width:28px;height:28px;border-radius:10px;border:3px solid var(--pink);background:var(--card);flex:none;
  display:grid;place-items:center;color:#fff;transition:all .18s}
.check.on{background:var(--mint);border-color:var(--mint);transform:scale(1.08)}
.input{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);font-weight:700;min-width:0;flex:1}
.input::placeholder{color:var(--ink-soft);opacity:.7}
.progress{height:12px;border-radius:99px;background:var(--card-2);border:2px solid var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:99px;transition:width .4s}
.conf{position:absolute;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:60;animation:conf 1.3s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:var(--card);border:2px solid var(--line);
  border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:var(--shadow);animation:pop .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.cloud,.puff,.wheel,.chug,.twinkle,.bob{animation:none}}

/* glass panels, time of day, dock */
.glass{background:rgba(255,250,252,.82);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 6px 18px rgba(236,95,149,.18)}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px}
.seg button{width:36px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--ink-soft);transition:background .15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--pink-deep);box-shadow:0 2px 6px rgba(236,95,149,.25)}
.tod{position:absolute;inset:0;z-index:5;pointer-events:none;transition:background .8s}
.stage[data-tod="sunset"] .tod{background:linear-gradient(rgba(255,140,90,.28),rgba(255,90,140,.2))}
.stage[data-tod="night"] .tod{background:linear-gradient(rgba(40,30,120,.55),rgba(80,40,120,.45));mix-blend-mode:multiply}
.stage[data-tod="night"] .lamp{opacity:1}
.lamp{opacity:0;transition:opacity .8s}
.dock{display:flex;gap:8px;align-items:center;padding:8px 10px;overflow-x:auto;scrollbar-width:thin;justify-content:safe center}
.dock button{position:relative;flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .15s}
.dock button:hover{transform:translateY(-4px)}
.dock .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:#fff;color:var(--ink);
  font:800 10px var(--font-body);display:grid;place-items:center;padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.dock .dot.ok{background:var(--mint);color:#fff}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.sway{animation:none}}

/* seasonal tokens (set via data-season on the root element) */
:root[data-season="spring"]{--bg0:#fff0f6; --bg1:#f9c3d8; --pink:#ff9cc2; --pink-deep:#ec6a9f; --line:#f8cfe0; --card-2:#fff1f7; --ink:#5b3a4a; --ink-soft:#94677b; --shadow:0 10px 30px rgba(236,106,159,.25)}
:root[data-season="summer"]{--bg0:#fdd2e1; --bg1:#f7a9c6}
:root[data-season="fall"]{--bg0:#ffe6cc; --bg1:#f2a46c; --pink:#f59a5c; --pink-deep:#d9672e; --line:#f2cfae; --card:#fffaf4; --card-2:#fff0e1; --ink:#5a3a2a; --ink-soft:#8f6a54; --gold:#f7b84a; --shadow:0 10px 30px rgba(190,100,40,.28)}
:root[data-season="winter"]{--bg0:#f4faff; --bg1:#b4d6f1; --pink:#7fb4e6; --pink-deep:#4b88c8; --line:#cfe3f5; --card:#fbfdff; --card-2:#eef6ff; --ink:#34465f; --ink-soft:#64799a; --gold:#ffd873; --shadow:0 10px 30px rgba(75,136,200,.25)}
.fall-p{animation:fall linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@keyframes glow{0%,100%{opacity:.2}50%{opacity:1}}
.glow-p{animation:glow ease-in-out infinite}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:50;min-width:210px;padding:8px;display:flex;flex-direction:column;gap:2px;animation:pop .2s}
.menu button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;font-weight:800;text-align:left;color:var(--ink)}
.menu button:hover{background:var(--card-2)}
.menu button[aria-checked="true"]{background:var(--card-2);box-shadow:inset 0 0 0 2px var(--pink)}
.due{font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.due.late{background:#ffe1e1;border-color:#ff9c9c;color:#c43c3c}
.due.soon{background:#fff2c9;border-color:#ffd873;color:#8a6410}
@media (prefers-reduced-motion:reduce){.fall-p,.glow-p{animation:none}}
.fall{animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(120px);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translateY(640px);opacity:0}}
.sideways{animation:sideways ease-in-out infinite alternate}
@keyframes sideways{from{transform:translateX(calc(var(--sw) * -1))}to{transform:translateX(var(--sw))}}
.tumble{animation:tumble linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tumble{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fall,.sideways,.tumble{animation:none;opacity:.7}}
.puff.fast{animation-duration:.9s}
.hoot{animation:hoot .5s ease-in-out infinite alternate}
@keyframes hoot{from{transform:rotate(-3deg) scale(1)}to{transform:rotate(3deg) scale(1.07)}}
.bob2{animation:bob2 1.2s ease-in-out infinite;transform-box:fill-box}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
.hopoff{animation:hopoff 1.3s ease-in forwards;transform-box:fill-box}
@keyframes hopoff{0%{transform:translate(0,0);opacity:1}35%{transform:translate(8px,-20px)}100%{transform:translate(44px,26px) rotate(40deg);opacity:0}}
.stage[data-exam="on"]{border-color:#ff9a5c;box-shadow:0 0 0 3px #ff7a45,0 0 36px rgba(255,90,40,.5)}
.stage[data-exam="on"] .tod{background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(255,80,30,.22))}
.stage[data-exam="on"][data-tod="night"] .tod{background:linear-gradient(rgba(40,30,120,.55),rgba(80,40,120,.45)),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(255,80,30,.3))}
@media (prefers-reduced-motion:reduce){.hoot,.bob2,.hopoff{animation:none}}
</style>
</head>
<body>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useLayoutEffect, useCallback, useMemo } = React;
const L = window.LucideReact || {};
const Icon = ({ name, size = 20, ...p }) => { const C = L[name] || L.Star || (() => null); return <C size={size} {...p} />; };

const PATH_D = "M 260 380 C 260 290, 400 250, 520 290 C 640 330, 720 250, 840 270 C 960 290, 1000 380, 940 440 C 880 500, 760 470, 650 500 C 540 530, 400 540, 320 490 C 280 465, 260 430, 260 380 Z";
const CENTER = { x: 600, y: 390 };
const ISLAND_D = "M 80 380 C 70 220, 300 120, 520 140 C 700 155, 800 110, 960 140 C 1110 170, 1140 300, 1100 400 C 1070 480, 1130 540, 1010 605 C 890 660, 640 650, 440 635 C 240 620, 90 540, 80 380 Z";
const ICONS = ["Briefcase","Shirt","GraduationCap","Home","Heart","Dumbbell","ShoppingBasket","Coffee","BookOpen","Landmark","Star","Sparkles"];
const KINDS = [["house", "House"], ["library", "Library"], ["cafe", "Cafe"], ["bank", "Bank"]];
const COLORS = ["#ff8fb8","#8fd3ff","#c3a6ff","#ffcf5c","#7fd8b0","#ffa98f"];
const uid = () => Math.random().toString(36).slice(2, 9);
const T = (text, done = false, due = "") => ({ id: uid(), text, done, due });

const DEFAULT_STATIONS = [
  { id: "jobs", kind: "house", name: "Job Applications Station", icon: "Briefcase", color: COLORS[0],
    tasks: [T("Tailor resume for 2 roles"), T("Send follow-up email"), T("Apply to 3 new postings")] },
  { id: "laundry", kind: "house", name: "Laundry Laundromat", icon: "Shirt", color: COLORS[1],
    tasks: [T("Wash whites"), T("Fold the dry load", true), T("Put away clean clothes")] },
  { id: "homework", kind: "house", academic: true, name: "Homework Academy", icon: "GraduationCap", color: COLORS[2],
    tasks: [T("Math worksheet"), T("Read Chapter 4"), T("Draft essay outline")] },
  { id: "home", kind: "house", name: "Tidy Home Depot", icon: "Home", color: COLORS[4],
    tasks: [T("Water the plants"), T("Take out the trash"), T("Wipe kitchen counters")] },
];
/* the three core stations, added once to existing saves by seedCore() */
const CORE_STATIONS = [
  { id: "gpa", kind: "library", academic: true, name: "The GPA Gym", icon: "BookOpen", color: "#a58bf0",
    tasks: [T("Study 45 minutes for the next exam"), T("Draft the essay intro"), T("Review this week's lecture notes")] },
  { id: "cafe", kind: "cafe", daily: true, name: "The Cafe / Lounge", icon: "Coffee", color: "#ffa98f",
    tasks: [T("Drink a glass of water"), T("5-minute stretch break"), T("Step outside for fresh air"), T("Text a friend")] },
  { id: "vault", kind: "bank", name: "The ATM Vault", icon: "Landmark", color: "#5fcfa0",
    tasks: [T("Check this week's budget limit"), T("Review subscription renewal dates"), T("Log today's spending")] },
];

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const prettyDue = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const seasonOf = m => (m === 11 || m <= 1) ? "winter" : m <= 4 ? "spring" : m <= 7 ? "summer" : "fall";

/* ---------- seasonal theme engine ---------- */
const THEMES = {
  summer: { label: "Summer", icon: "Sun", page: "#f9b4cc", bgA: "#fdd2e1", bgB: "#f7a9c6", grass: "#9fdc8f", grassHi: "#c3ecae", rim: ["#e98bb0","#f29fbf","#f9b6cf"],
    pond: "#8ec8f5", shore: "#ffc6da", trees: [["#7fcf82","#98dc94"],["#8fd98a","#a9e5a2"],["#6fc5a0","#8ad8b6"]], snowCap: false,
    tiles: ["#ff9bb8","#ffc98f","#fff0a0","#a8e6b8","#a3d4ff","#cdb4ff"], plate: "#ffe9f2", cloud: "#fff", cloudO: 1, roof: "#ff8fb8",
    ui: { pink: "#ff8fb8", deep: "#ec5f95", ink: "#5b3a4a", soft: "#8c6577", card: "#fffafc", card2: "#fff0f6", line: "#f6c9dc", shadow: "rgba(236,95,149,.25)" },
    particle: "sparkle", cap: ["#7fb8ff","#ff9bc2","#ff7a7a"] },
  winter: { label: "Winter", icon: "Snowflake", page: "#bcd9f2", bgA: "#eaf5ff", bgB: "#a9cdf0", grass: "#f2f8ff", grassHi: "#ffffff", rim: ["#86aed6","#9ec0e0","#bdd7ee"],
    pond: "#bfe6ff", shore: "#ffffff", trees: [["#8fbfae","#b5d8ca"],["#7fb0a6","#a4cfc4"],["#9cc7b4","#c2e0d3"]], snowCap: true,
    tiles: ["#ffb3cf","#ffffff","#bfe3ff","#d3dcff","#e6f3ff","#ffd1e3"], plate: "#ffffff", cloud: "#ffffff", cloudO: 1, roof: "#9cc7f2",
    ui: { pink: "#8fc1f2", deep: "#4f94dc", ink: "#3f5a7a", soft: "#7391b0", card: "#fbfdff", card2: "#eaf4ff", line: "#cfe3f7", shadow: "rgba(80,130,200,.28)" },
    particle: "snow", cap: ["#9cc7f2","#ffffff","#ff9bb8"] },
  spring: { label: "Spring", icon: "Flower2", page: "#ffc6da", bgA: "#ffe8f0", bgB: "#ffb4cf", grass: "#b3e89c", grassHi: "#d4f5bd", rim: ["#ee8cb2","#f6a6c4","#fbc4d8"],
    pond: "#9fd4f5", shore: "#ffd6e5", trees: [["#ffb3cf","#ffd3e3"],["#ff9fc2","#ffc4d9"],["#ffc2d8","#ffe0ea"]], snowCap: false,
    tiles: ["#ff9bb8","#ffd0a0","#fff2a8","#b6ecb8","#b3dcff","#d9bcff"], plate: "#fff0f6", cloud: "#ffffff", cloudO: 1, roof: "#ff9bc2",
    ui: { pink: "#ff9bc2", deep: "#ea5a95", ink: "#5b3a4a", soft: "#8c6577", card: "#fffafc", card2: "#fff0f6", line: "#f7cadd", shadow: "rgba(234,90,149,.25)" },
    particle: "petal", cap: ["#ffb3cf","#ffffff","#c7a6ff"] },
  fall: { label: "Fall", icon: "Leaf", page: "#f6c590", bgA: "#ffe5bd", bgB: "#f4a56c", grass: "#d2b068", grassHi: "#e6cf93", rim: ["#8a5a3c","#a06b46","#bb8459"],
    pond: "#7fb5c9", shore: "#e9c48f", trees: [["#ef8338","#f6ad57"],["#d9573a","#ec7c58"],["#f2b83f","#f8d06f"]], snowCap: false,
    tiles: ["#e8734a","#f2a65a","#f7d070","#b9c26a","#c98b5e","#d9573a"], plate: "#fff1de", cloud: "#fff4e6", cloudO: .85, roof: "#e8803c",
    ui: { pink: "#f2a45c", deep: "#d9672a", ink: "#5a3a2a", soft: "#8c6a52", card: "#fffaf2", card2: "#fff0de", line: "#f0cfa8", shadow: "rgba(200,100,40,.28)" },
    particle: "leaf", cap: ["#e8734a","#f2b83f","#a0623e"] },
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
/* ---------- focus timer, streaks, passengers ---------- */
const FOCUS_SECONDS = 25 * 60;
const fmtClock = sec => `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
const dayStr = (offset = 0) => { const d = new Date(); d.setDate(d.getDate() + offset); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const EMPTY_STREAK = { count: 0, last: "", prevCount: 0, prevLast: "" };
const AVATARS = [["🐰", "#ffd6e7"], ["🐱", "#ffe3b8"], ["🐻", "#e8cdb3"], ["🐼", "#e6e6f5"], ["🐸", "#c9f0c4"], ["🐥", "#fff2a8"], ["🦊", "#ffc9a3"], ["🐷", "#ffc7da"]];
const avatarFor = (stations, id) => AVATARS[Math.max(0, stations.findIndex(s => s.id === id)) % AVATARS.length];
const fullyDone = s => s.tasks.length > 0 && s.tasks.every(t => t.done);
/* whole days from today to a YYYY-MM-DD date (negative once it has passed) */
const daysUntil = ds => { if (!ds) return null; const [y, m, d] = ds.split("-").map(Number); const t = new Date(y, m - 1, d), n = new Date(); n.setHours(0, 0, 0, 0); return Math.round((t - n) / 86400000); };
const isAcademic = s => !!s.academic;

/* first run: defaults + core stations. Older saves: add the core stations once, keep everything else.
   Also does the once-a-day housekeeping: breaks missed streaks and resets "repeat daily" stations. */
let LOST_ON_LOAD = [];
function loadStations() {
  const saved = store.get("cozy-train-v1", null);
  const seeded = store.get("cozy-train-seed", 0);
  let list = saved || [...DEFAULT_STATIONS, ...CORE_STATIONS];
  list = list.map(s => ({
    kind: "house", ...s,
    academic: s.academic ?? ["homework", "gpa"].includes(s.id),
    daily: s.daily ?? s.id === "cafe",
    streak: { ...EMPTY_STREAK, ...(s.streak || {}) },
    tasks: (s.tasks || []).map(t => ({ due: "", ...t })),
  }));
  if (saved && seeded < 2) { CORE_STATIONS.forEach(c => { if (!list.some(s => s.id === c.id)) list.push(JSON.parse(JSON.stringify({ ...c, streak: EMPTY_STREAK }))); }); }
  store.set("cozy-train-seed", 2);
  const today = dayStr(), yesterday = dayStr(-1), lastDay = store.get("cozy-train-lastday", today);
  const riders = list.filter(s => s.streak.count > 0).map(s => s.id);
  LOST_ON_LOAD = [];
  list = list.map(s => {
    let out = s;
    if (s.streak.count > 0 && s.streak.last < yesterday) {
      LOST_ON_LOAD.push({ id: s.id, name: s.name, slot: riders.indexOf(s.id) });
      out = { ...out, streak: { ...EMPTY_STREAK } };
    }
    if (lastDay !== today && s.daily) out = { ...out, tasks: out.tasks.map(t => ({ ...t, done: false })) };

}

let actx = null;
function blip(freqs, dur = 0.12, type = "triangle", vol = 0.12) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * dur * 0.8;
      o.type = type; o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.1);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.12);
    });
  } catch (e) {}
}

const SPEEDS = [0.5, 1, 2];

const CAR_COLORS = ["#ffd6a5", "#b8e6d0", "#cfd9ff", "#ffd1e3"];

function App() {
  const [stations, setStations] = useState(loadStations);

  const [openId, setOpenId] = useState(null);

  const [toast, setToast] = useState(null);

  const [stopped, setStopped] = useState(null);
  const [tod, setTod] = useState(() => store.get("cozy-train-tod", (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "sunset" : "day"));
  useEffect(() => store.set("cozy-train-tod", tod), [tod]);
  const [themePref, setThemePref] = useState(() => store.get("cozy-train-theme", "auto"));
  const [themeMenu, setThemeMenu] = useState(false);
  const now = useMemo(() => new Date(), []);
  const autoSeason = seasonOf(now.getMonth());
  const season = themePref === "auto" || !THEMES[themePref] ? autoSeason : themePref;
  const th = THEMES[season];
  useEffect(() => store.set("cozy-train-theme", themePref), [themePref]);
  useEffect(() => {   /* push the seasonal palette into the CSS tokens */
    const r = document.documentElement.style, u = th.ui;
    const map = { "--pink": u.pink, "--pink-deep": u.deep, "--ink": u.ink, "--ink-soft": u.soft, "--card": u.card, "--card-2": u.card2, "--line": u.line, "--shadow": "0 10px 30px " + u.shadow,
      "--page-bg": th.page, "--stage-a": th.bgA, "--stage-b": th.bgB };
    Object.entries(map).forEach(([k, v]) => r.setProperty(k, v));
  }, [season]);
  useEffect(() => { if (!themeMenu) return; const h = e => { if (!e.target.closest || !e.target.closest("[data-theme-menu]")) setThemeMenu(false); }; document.addEventListener("mousedown", h); return () => document.removeEventListener("mousedown", h); }, [themeMenu]);

  /* priority mode, focus timer, schedule, countdown */
  const [exam, setExam] = useState(() => store.get("cozy-train-exam", false));
  const [examDate, setExamDate] = useState(() => store.get("cozy-train-examdate", ""));
  const [timer, setTimer] = useState(() => store.get("cozy-train-timer", null));
  const [isSpittingSteam, setIsSpittingSteam] = useState(() => { const t = store.get("cozy-train-timer", null); return !!(t && t.endsAt > Date.now()); });
  const [hoot, setHoot] = useState(null);
  const [logOpen, setLogOpen] = useState(false);
  const [logItems, setLogItems] = useState(() => store.get("cozy-train-log", []));
  const [hop, setHop] = useState(() => LOST_ON_LOAD.map(l => ({ key: l.id + "-hop-" + uid(), id: l.id, slot: Math.max(0, l.slot) })));
  useEffect(() => store.set("cozy-train-exam", exam), [exam]);
  useEffect(() => store.set("cozy-train-examdate", examDate), [examDate]);
  useEffect(() => store.set("cozy-train-timer", timer), [timer]);
  useEffect(() => store.set("cozy-train-log", logItems), [logItems]);

  const stageRef = useRef(null), pathRef = useRef(null);
  const engineRef = useRef(null), carRefs = useRef([]);
  const live = useRef({});
  live.current = { speed, muted, openId, exam, acad: new Set(stations.filter(isAcademic).map(s => s.id)) };
  const play = fn => { if (!live.current.muted) fn(); };

  useEffect(() => store.set("cozy-train-v1", stations), [stations]);
  useEffect(() => store.set("cozy-train-speed", speed), [speed]);
  useEffect(() => store.set("cozy-train-muted", muted), [muted]);
  useLayoutEffect(() => { if (pathRef.current) setLen(pathRef.current.getTotalLength()); }, []);

  /* station positions along the track, pushed outward from the loop's centre */
  const spots = useMemo(() => {
    if (!len || !pathRef.current) return [];
    return stations.map((st, i) => {
      const at = frac(i, stations.length) * len;
      const p = pathRef.current.getPointAtLength(at);
      const dx = p.x - CENTER.x, dy = p.y - CENTER.y, m = Math.hypot(dx, dy) || 1;
      const off = i % 2 === 0 ? 74 : -66;
      return { id: st.id, at, x: p.x + dx / m * off, y: p.y + dy / m * off * 0.85 - 8 };
    });
  }, [len, stations.length]);
  const spotsRef = useRef([]); spotsRef.current = spots;

  /* train animation loop */
  useEffect(() => {
    if (!len) return;
    const path = pathRef.current;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let dist = len * 0.02, last = performance.now(), holdUntil = 0, raf, wasHeld = false;
    const place = (el, d, back) => {
      if (!el) return;
      const dd = ((d - back) % len + len) % len;
      const p = path.getPointAtLength(dd), q = path.getPointAtLength((dd + 3) % len);
      let a = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
      const flip = Math.abs(a) > 90;
      el.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(flip ? a - 180 : a).toFixed(1)}) scale(${flip ? -1 : 1} 1)`);
    };
    const tick = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (now < holdUntil) { if (!wasHeld) { wasHeld = true; } }
      else {
        if (wasHeld) { wasHeld = false; setStopped(null); }
        if (!reduce) {
          const prev = dist; dist += BASE_SPEED * live.current.speed * dt;
          const wrapped = dist >= len; if (wrapped) dist -= len;
          for (const s of spotsRef.current) {
            if (live.current.exam && !live.current.acad.has(s.id)) continue;   /* Exam Week: skip non-school stops */
            const crossed = wrapped ? (s.at > prev || s.at <= dist) : (s.at > prev && s.at <= dist);
            if (crossed) {
              holdUntil = now + DWELL_MS / live.current.speed;
              dist = s.at; setStopped(s.id); play(sfx.toot); break;
            }
          }
        }
      }
      place(engineRef.current, dist, 0); carRefs.current.forEach((el, i) => place(el, dist, 62 + CAR_GAP * i));
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [len]);

  /* actions */
  const popToast = msg => { setToast(msg); clearTimeout(popToast.t); popToast.t = setTimeout(() => setToast(null), 2400); };
  const burst = (el, big) => {
    const s = stageRef.current.getBoundingClientRect();
    const r = el ? el.getBoundingClientRect() : { left: s.left + s.width / 2, top: s.top + s.height / 2, width: 0, height: 0 };
    const id = uid(); setBursts(b => [...b, { id, big, x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 }]);
    setTimeout(() => setBursts(b => b.filter(x => x.id !== id)), 1500);
  };
  const patch = (id, fn) => setStations(ss => ss.map(s => s.id === id ? fn(s) : s));
  const open = id => { play(sfx.open); setOpenId(id); };
  const toggle = (sid, tid, el) => {
    const st = stations.find(s => s.id === sid), t = st.tasks.find(x => x.id === tid);
    const nowDone = !t.done;
    const allDone = nowDone && st.tasks.every(x => x.id === tid || x.done);
    patch(sid, s => ({ ...s, tasks: s.tasks.map(x => x.id === tid ? { ...x, done: nowDone } : x) }));
    if (!nowDone) return play(sfx.uncheck);
    if (allDone) { play(sfx.win); burst(null, true); popToast(`${st.name} is all done! ★`); }
    else { play(sfx.check); burst(el, false); }
  };
  const addTask = (sid, text, due) => { play(sfx.add); patch(sid, s => ({ ...s, tasks: [...s.tasks, T(text, false, due || "")] })); };
  const delTask = (sid, tid) => { play(sfx.del); patch(sid, s => ({ ...s, tasks: s.tasks.filter(x => x.id !== tid) })); };
  const rename = (sid, name) => patch(sid, s => ({ ...s, name }));
  const removeStation = sid => { if (timer && timer.sid === sid) stopTimer(); play(sfx.del); setOpenId(null); setStations(ss => ss.filter(s => s.id !== sid)); popToast("Station removed"); };
  const createStation = ({ name, icon, color, kind, academic }) => {
    play(sfx.add); setStations(ss => [...ss, { id: uid(), kind, name, icon, color, academic: !!academic, daily: false, streak: { ...EMPTY_STREAK }, tasks: [] }]); setAdding(false); popToast(`${name} is on the track!`);
  };

  const flag = (sid, key, val) => patch(sid, s => ({ ...s, [key]: val }));
  const startTimer = sid => { play(sfx.open); setTimer({ sid, endsAt: Date.now() + FOCUS_SECONDS * 1000 }); setIsSpittingSteam(true); setHoot(null); popToast("Boiler fired up. 25 minutes of focus!"); };
  function stopTimer() { setTimer(null); setIsSpittingSteam(false); }
  useEffect(() => {
    if (!timer) return;
    const finish = () => { setTimer(null); setIsSpittingSteam(false); setHoot({ sid: timer.sid }); if (!live.current.muted) sfx.hoot(); try { burst(null, true); } catch (e) {} };
    const id = setTimeout(finish, Math.max(0, timer.endsAt - Date.now()));
    return () => clearTimeout(id);
  }, [timer]);

  const fullRef = useRef(null);
  /* habit streaks: a fully ticked station earns today's +1; un-ticking takes it back */
  useEffect(() => {
    const today = dayStr(), yest = dayStr(-1), riders = stations.filter(s => s.streak && s.streak.count > 0).map(s => s.id);
    let changed = false; const won = [], left = [];
    const prev = fullRef.current, first = prev === null; fullRef.current = {};
    const next = stations.map(s => {
      const st = s.streak || EMPTY_STREAK, full = fullyDone(s);
      fullRef.current[s.id] = full;
      if (first) return s;   /* loading a save never earns credit; only ticking things off today does */
      const justFinished = full && !prev[s.id];
      if (justFinished && st.last !== today) { changed = true; won.push(s); const count = st.last === yest ? st.count + 1 : 1; return { ...s, streak: { count, last: today, prevCount: st.count, prevLast: st.last } }; }
      if (!full && st.last === today) { changed = true; if (st.prevCount === 0) left.push({ id: s.id, slot: Math.max(0, riders.indexOf(s.id)) }); return { ...s, streak: { ...st, count: st.prevCount, last: st.prevLast } }; }
      return s;
    });
    if (!changed) return;
    setStations(next);
    if (won.length) { play(sfx.board); popToast(`${won[0].name}: ${next.find(s => s.id === won[0].id).streak.count}-day streak! A passenger boards.`); }
    if (left.length) { const hs = left.map(l => ({ key: l.id + "-hop-" + uid(), ...l })); setHop(h => [...h, ...hs]); }
  }, [stations]);
  useEffect(() => { if (!hop.length) return; const id = setTimeout(() => setHop([]), 1500); return () => clearTimeout(id); }, [hop]);
  useEffect(() => { if (LOST_ON_LOAD.length) { popToast(`${LOST_ON_LOAD[0].name}: streak ended, a passenger hopped off.`); LOST_ON_LOAD = []; } }, []);

  /* passengers: one rider per running streak, two seats per car */
  const riders = stations.filter(s => s.streak && s.streak.count > 0).slice(0, 8).map((s, slot) => { const [emoji, bg] = avatarFor(stations, s.id); return { key: s.id, emoji, bg, slot, title: `${s.name}: ${s.streak.count}-day streak` }; });
  const hoppers = hop.map(h => { const [emoji, bg] = avatarFor(stations, h.id); return { key: h.key, emoji, bg, slot: Math.min(7, h.slot), hop: true, title: "Streak ended" }; });
  const seated = [...riders, ...hoppers];
  const nCars = Math.max(2, Math.min(4, Math.ceil(Math.max(0, ...seated.map(p => p.slot + 1)) / 2)));
  const carRiders = i => seated.filter(p => Math.floor(p.slot / 2) === i).map(p => ({ ...p, seat: p.slot % 2 }));
  const logToggle = id => setLogItems(xs => xs.map(i => i.id === id ? { ...i, doneOn: i.doneOn === dayStr() ? "" : dayStr() } : i));
  const timerStation = timer ? stations.find(s => s.id === timer.sid) : null;

  const all = stations.flatMap(s => s.tasks), doneAll = all.filter(t => t.done).length;
  const openSt = stations.find(s => s.id === openId);
  const overdue = all.filter(t => !t.done && t.due && t.due < todayStr()).length;
  const isDone = s => s.tasks.length > 0 && s.tasks.every(t => t.done);

  return (
    <>
      <header className="flex flex-wrap items-stretch gap-2">
        <div className="glass px-4 py-3 min-w-0 flex-1" style={{ flexBasis: 260 }}>
          <div className="flex items-baseline gap-3 flex-wrap">
            <h1 className="display text-2xl font-bold leading-none"> Babby Cozy Express</h1>
            <span className="text-sm font-extrabold flex items-center gap-1" style={{ color: "var(--ink-soft)" }}><Icon name="CalendarDays" size={14} />{now.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })} · {THEMES[autoSeason].label}</span>
            <span className="text-sm font-extrabold" style={{ color: "var(--ink-soft)" }}>{doneAll}/{all.length} tasks · {stations.filter(isDone).length}/{stations.length} stops{overdue > 0 ? ` · ${overdue} overdue` : ""}</span>
          </div>
          <div className="progress mt-2"><i style={{ width: (all.length ? doneAll / all.length * 100 : 0) + "%" }} /></div>
        </div>
        <TicketCounter date={examDate} onChange={setExamDate} />
        <div className="glass seg self-center" role="group" aria-label="Time of day">
          {[["day", "Sun", "Day"], ["sunset", "Sunset", "Sunset"], ["night", "Moon", "Night"]].map(([k, ic, lb]) =>
            <button key={k} aria-pressed={tod === k} aria-label={lb} title={lb} onClick={() => setTod(k)}><Icon name={ic} size={18} /></button>)}
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <button className="pill glass" id="exam-week" aria-pressed={exam} aria-label="Exam Week Express: only schoolwork stops" onClick={() => { setExam(x => !x); play(sfx.toot); popToast(!exam ? "Exam Week Express: only schoolwork stops are lit." : "Back to the regular route."); }}
            style={exam ? { background: "linear-gradient(135deg,#ff6a3d,#ff3d5a)", color: "#fff", borderColor: "#ffb48a" } : undefined}><Icon name="Flame" size={18} />Exam Week</button>
          <button className="pill glass" id="speed" onClick={() => setSpeed(SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length])} aria-label={`Train speed ${speed}x. Change speed`}><Icon name="Gauge" size={18} />{speed}x</button>
          <button className="pill glass" id="mute" onClick={() => setMuted(m => !m)} aria-pressed={muted} aria-label={muted ? "Turn sound on" : "Turn sound off"}><Icon name={muted ? "VolumeX" : "Volume2"} size={18} /></button>
          <div className="relative" data-theme-menu>
            <button className="pill glass" id="theme-btn" aria-haspopup="menu" aria-expanded={themeMenu} aria-label="Change seasonal theme" onClick={() => setThemeMenu(o => !o)}><Icon name={th.icon} size={18} />{th.label}<Icon name="ChevronDown" size={14} /></button>
            {themeMenu && (
              <div className="glass absolute right-0 mt-2 p-2 flex flex-col gap-1" style={{ zIndex: 50, minWidth: 190, background: "var(--card)" }} role="menu">
                {[["auto", "CalendarDays", `Auto (${THEMES[autoSeason].label})`], ...Object.entries(THEMES).map(([k, v]) => [k, v.icon, v.label])].map(([k, ic, lb]) => (
                  <button key={k} role="menuitemradio" aria-checked={themePref === k} onClick={() => { setThemePref(k); setThemeMenu(false); }}
                    className="flex items-center gap-2 px-3 py-2 rounded-xl font-extrabold text-left" style={{ background: themePref === k ? "var(--card-2)" : "transparent", color: "var(--ink)" }}>
                    <Icon name={ic} size={16} />{lb}{themePref === k && <Icon name="Check" size={14} className="ml-auto" />}
                  </button>))}
              </div>)}
          </div>
          <button className="btn-primary" id="add-station" onClick={() => { play(sfx.open); setAdding(true); }}><Icon name="Plus" size={18} strokeWidth={3} />Add station</button>
        </div>
      </header>

      <main className="stage" ref={stageRef} data-tod={tod} data-exam={exam ? "on" : "off"}>
        <svg className="world" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" style={{ overflow: "visible" }} aria-label="A pastel train loop with your task stations">
          <Scenery th={th} />
          <Track th={th} exam={exam} />
          <Particles kind={th.particle} th={th} key={season} />
          <path ref={pathRef} d={PATH_D} fill="none" stroke="none" />
          {spots.map((sp, i) => stations[i] && <Station key={sp.id} st={stations[i]} x={sp.x} y={sp.y} onOpen={open} active={stopped === sp.id} dim={exam && !isAcademic(stations[i])} />)}
          <g style={{ pointerEvents: "none" }}>
            {Array.from({ length: nCars }, (_, k) => nCars - 1 - k).map(i =>
              <Car key={i} refEl={el => { carRefs.current[i] = el; }} color={CAR_COLORS[i % CAR_COLORS.length]} paused={!!stopped} riders={carRiders(i)} />)}
            <Engine refEl={engineRef} paused={!!stopped} steam={isSpittingSteam} />
          </g>
        </svg>
        {stopped && stations.find(s => s.id === stopped) && !openId && (
          <div className="toast" style={{ bottom: "auto", top: 14 }} aria-live="polite">
            Stopped at {stations.find(s => s.id === stopped).name} · tap it to open
          </div>
        )}
        {toast && <div className="toast" role="status">{toast}</div>}
        <div className="tod" />
        <Confetti bursts={bursts} />
        {timer && <TimerPill timer={timer} name={timerStation ? timerStation.name : ""} onStop={stopTimer} />}
        <button className="glass absolute flex flex-col items-center gap-1 px-2 py-3 font-extrabold text-xs" aria-label="Open conductor's log" style={{ right: 0, top: "38%", zIndex: 25, borderRadius: "18px 0 0 18px", borderRight: 0, color: "var(--ink)" }} onClick={() => setLogOpen(true)}>
          <Icon name="ClipboardList" size={20} />Log<span style={{ color: "var(--ink-soft)" }}>{logItems.filter(i => i.doneOn === dayStr()).length}/{logItems.length}</span>
        </button>
        <ConductorLog open={logOpen} onClose={() => setLogOpen(false)} items={logItems}
          onAdd={(time, title) => { play(sfx.add); setLogItems(xs => [...xs, { id: uid(), time, title, doneOn: "" }]); }}
          onToggle={id => { play(sfx.check); logToggle(id); }} onDelete={id => { play(sfx.del); setLogItems(xs => xs.filter(i => i.id !== id)); }} />
        {hoot && <HootAlert name={(stations.find(s => s.id === hoot.sid) || {}).name} onClose={() => setHoot(null)} onAgain={() => startTimer(hoot.sid)} />}
        {openSt && <ChecklistModal st={openSt} onClose={() => setOpenId(null)} onToggle={toggle} onAdd={addTask} onDelete={delTask} onRemoveStation={removeStation} onRename={rename} timer={timer} timerStation={timerStation} onStartTimer={startTimer} onStopTimer={stopTimer} onFlag={flag} />}
        {adding && <AddStationModal onClose={() => setAdding(false)} onCreate={createStation} />}
      </main>

      <nav aria-label="Stations" className="glass dock">
        {stations.map(s => {
          const dn = s.tasks.filter(t => t.done).length, ok = isDone(s);
          return (
            <button key={s.id} onClick={() => open(s.id)} title={s.name} data-dim={exam && !isAcademic(s)} aria-label={`${s.name}, ${dn} of ${s.tasks.length} done`} style={{ background: s.color, opacity: exam && !isAcademic(s) ? .35 : 1 }}>
              <Icon name={s.icon} size={24} strokeWidth={2.4} />
              <span className={"dot " + (ok ? "ok" : "")}>{ok ? "★" : `${dn}/${s.tasks.length}`}</span>
            </button>
          );
        })}
      </nav>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
